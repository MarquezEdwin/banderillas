function startCountdown() {
    const countdownDate = new Date("2024-01-15").getTime();
    const x = setInterval(function() {
        const now = new Date().getTime();
        const distance = countdownDate - now;
        
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        document.getElementById("countdown").innerHTML = 
            hours + ":" + minutes + ":" + seconds;
        
        if (distance < 0) {
            clearInterval(x);
            document.getElementById("countdown").innerHTML = "¡EXPIRADA!";
        }
    }, 1000);
}

startCountdown();

.faq {
    padding: 6rem 2rem;
    max-width: 800px;
    margin: 0 auto;
}

.faq-container {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 3rem;
}

.faq-item {
    border: 2px solid var(--primary-yellow);
    border-radius: 10px;
    overflow: hidden;
}

.faq-button {
    width: 100%;
    padding: 1.5rem;
    background: linear-gradient(135deg, var(--primary-cream), white);
    border: none;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.3s ease;
}

.faq-button:hover {
    background: linear-gradient(135deg, var(--primary-yellow), var(--primary-cream));
}

.faq-content {
    display: none;
    padding: 1.5rem;
    color: var(--text-light);
    line-height: 1.6;
    border-top: 2px solid var(--primary-yellow);
}

.faq-content.active {
    display: block;
}

JavaScript:

document.querySelectorAll('.faq-button').forEach(button => {
    button.addEventListener('click', function() {
        const content = this.nextElementSibling;
        const allContents = document.querySelectorAll('.faq-content');
        
        allContents.forEach(item => {
            if (item !== content) item.classList.remove('active');
        });
        
        content.classList.toggle('active');
    });
});
